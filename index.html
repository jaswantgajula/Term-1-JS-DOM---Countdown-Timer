<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A beautiful, modern countdown timer with stunning visual effects and notifications">
    <title>Countdown Timer - Modern & Beautiful</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <h1>Count Down Timer</h1>
        <input type="number" id="secondsInput" placeholder="Enter seconds..." min="1"
            aria-label="Enter countdown duration in seconds">
        <button id="startBtn" aria-label="Start countdown timer">Start</button>

        <p id="display" aria-live="polite">Time Left: </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
